[package]
name = "oas"
version = "0.1.0"
edition = "2024"
authors = ["Matthias Dellweg"]
publish = false

[dependencies]
log = "0.4.29"
pyo3 = { version = "0.29.3", features = ["anyhow"] }
reqwest = { version = "0.13.2", features = ["json"] }
tokio = "1.53.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.104"
jsonschema = "0.61.0"
jaq-core = "3.1.2"

[dev-dependencies]
httpmock = "0.9.0"
