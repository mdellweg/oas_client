[project]
name = "py-rust"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matthias Dellweg", email = "2500@gmx.de" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
py-rust = "py_rust:main"

[tool.maturin]
module-name = "py_rust._core"
python-packages = ["py_rust"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
